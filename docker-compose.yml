version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: parcelpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: parcelpulse
      POSTGRES_USER: parcelpulse
      POSTGRES_PASSWORD: devpassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcelpulse"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
